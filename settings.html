<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件设置 · 主动发消息</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif; background: #0f1115; color: #e6e8ee; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: #8b93a7; margin-bottom: 18px; font-size: 13px; }
  .card { background: #171a21; border: 1px solid #262b36; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: #d7dcea; }
  label { display: block; margin: 10px 0 5px; color: #b9c0d0; }
  input[type=number], input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 7px 10px; border-radius: 8px; border: 1px solid #2c3340; background: #0f1115; color: #e6e8ee; font: inherit; }
  input[type=number] { width: 150px; }
  input[type=checkbox] { width: 16px; height: 16px; vertical-align: -3px; }
  button { padding: 7px 14px; border-radius: 8px; border: 1px solid #2f6fed; background: #2f6fed; color: #fff; cursor: pointer; font-size: 13px; }
  button.ghost { background: transparent; color: #9fb6ff; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .status { margin-top: 10px; color: #8b93a7; white-space: pre-wrap; font-size: 13px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  .hint { color: #6f7789; font-size: 12px; margin-top: 3px; }
  textarea { height: 130px; font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>主动发消息</h1>
  <div class="sub">桥启动即开始计时，桥关闭即结束。期间每隔一段时间提醒一次，由 Agent 自己决定发不发。</div>

  <div class="card">
    <h2>参数</h2>
    <div class="row"><label style="margin:0"><input type="checkbox" id="enabled"> 启用插件</label></div>
    <label>提醒间隔（分钟，10~720）</label>
    <input type="number" id="intervalMinutes" min="10" max="720" step="10" value="60">
    <div class="hint">默认 60 分钟。计时起点是桥启动，终点是桥关闭。</div>
    <div class="row"><label style="margin:0"><input type="checkbox" id="includeQzone"> 提醒里包含「发空间说说 / 刷动态」</label></div>
    <label>提醒投递给哪个会话（留空 = ownerQQ 私聊）</label>
    <input type="text" id="targetKey" placeholder="private:&lt;QQ&gt; 或 group:&lt;群号&gt;">
    <div class="row">
      <button id="save">保存</button>
      <button id="runNow" class="ghost">立即触发一次</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h2>导入 / 导出</h2>
    <div class="hint">导出当前参数为 JSON；粘贴 JSON 后点导入，会先校验再写入。</div>
    <div class="row">
      <button id="export">导出为文件</button>
      <button id="copy" class="ghost">复制</button>
      <button id="fill" class="ghost">载入当前配置</button>
    </div>
    <label>配置 JSON</label>
    <textarea id="json"></textarea>
    <div class="row"><button id="import">导入</button></div>
    <div class="status" id="ioStatus"></div>
  </div>

  <div class="card">
    <h2>运行状态</h2>
    <div class="status" id="state"></div>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
const $ = (id) => document.getElementById(id);
const setStatus = (el, msg, cls) => { const n = $(el); n.className = 'status ' + (cls || ''); n.textContent = msg; };

async function api(path, opts) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(path + sep + 'token=' + encodeURIComponent(token), opts);
  const text = await res.text();
  try { return { status: res.status, body: JSON.parse(text) }; } catch { return { status: res.status, body: { raw: text } }; }
}

function currentConfig() {
  return {
    enabled: $('enabled').checked,
    intervalMinutes: Number($('intervalMinutes').value),
    includeQzone: $('includeQzone').checked,
    targetKey: $('targetKey').value.trim()
  };
}

function fill(cfg, state) {
  $('enabled').checked = cfg.enabled !== false;
  $('intervalMinutes').value = cfg.intervalMinutes ?? 60;
  $('includeQzone').checked = cfg.includeQzone !== false;
  $('targetKey').value = cfg.targetKey || '';
  const last = state && state.lastRunAt ? new Date(state.lastRunAt).toLocaleString() : '还没触发过';
  $('state').textContent = '上次触发：' + last + '\n窗口：桥在运行期间生效（桥停即停）\n规则：两项都不做 = 完成；只做一件自己挑；两件都做先说再发消息';
  $('json').value = JSON.stringify(currentConfig(), null, 2);
}

async function load() {
  const r = await api('/api/plugin/proactive', { method: 'GET' });
  if (r.status !== 200) { setStatus('status', '读取失败（' + r.status + '）', 'err'); return; }
  fill(r.body.config || {}, r.body.state || {});
  setStatus('status', '已读取', 'ok');
}

$('save').onclick = async () => {
  const r = await api('/api/plugin/proactive', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(currentConfig()) });
  if (r.status === 200 && r.body.ok) { fill(r.body.config, {}); setStatus('status', '已保存', 'ok'); }
  else setStatus('status', '保存失败：' + JSON.stringify(r.body), 'err');
};

$('runNow').onclick = async () => {
  $('runNow').disabled = true;
  setStatus('status', '正在触发…');
  const r = await api('/api/plugin/proactive/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
  $('runNow').disabled = false;
  setStatus('status', r.body && r.body.ok ? ('已投递，目标 ' + (r.body.key || '')) : ('触发失败：' + JSON.stringify(r.body)), r.body && r.body.ok ? 'ok' : 'err');
  load();
};

$('export').onclick = () => {
  const blob = new Blob([JSON.stringify(currentConfig(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'proactive-plugin-config.json';
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus('ioStatus', '已导出', 'ok');
};

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(currentConfig(), null, 2)); setStatus('ioStatus', '已复制', 'ok'); }
  catch { setStatus('ioStatus', '复制失败，请手动选中', 'err'); }
};

$('fill').onclick = () => { $('json').value = JSON.stringify(currentConfig(), null, 2); };

$('import').onclick = async () => {
  let cfg;
  try { cfg = JSON.parse($('json').value); } catch { setStatus('ioStatus', 'JSON 解析失败', 'err'); return; }
  const r = await api('/api/plugin/proactive', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cfg) });
  if (r.status === 200 && r.body.ok) { fill(r.body.config, {}); setStatus('ioStatus', '导入成功', 'ok'); }
  else setStatus('ioStatus', '导入失败：' + JSON.stringify(r.body), 'err');
};

load();
</script>
</body>
</html>
